<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Wren AI Firewall Demo</title>


<link rel="stylesheet" href="style.css">
</head>

<body>

<h1>Wren — AI Firewall for LLM Applications</h1>

<div class="container">

<div class="chat">

<h2>Chat</h2>

<div id="messages"></div>

<div style="display: flex; gap: 5px; align-items: center; margin-top: 10px;">
    <input type="file" id="fileInput" accept="application/pdf" style="display:none" onchange="handleFile(this, 'application/pdf')">
    <input type="file" id="imageInput" accept="image/*" style="display:none" onchange="handleFile(this, 'image/png')">
    
    <button class="btn-file" onclick="document.getElementById('fileInput').click()" title="Upload PDF">📄</button>
    <button class="btn-file" onclick="document.getElementById('imageInput').click()" title="Upload Image">🖼️</button>
    
    <input id="input" style="flex-grow: 1; padding: 5px;" placeholder="Type a message..." onkeydown="if(event.key==='Enter') sendMessage()" />
    <button onclick="sendMessage()" style="padding: 5px 15px;">Send</button>
</div>

</div>


<div class="events">

<h2>Security Monitor</h2>

<div id="events"></div>

</div>

</div>

<style>
#messages div { white-space: pre-wrap; }
</style>
<script src="app.js?v=3"></script>
</body>
</html>
